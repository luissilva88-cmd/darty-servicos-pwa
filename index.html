<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e30613"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><title>Darty Serviços</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f4f4;color:#222}.top{background:#e30613;color:white;padding:18px 16px;font-weight:900;font-size:24px;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:980px;margin:auto;padding:18px}.card{background:white;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 4px 18px #0001}.grid{display:grid;gap:14px}@media(min-width:800px){.grid{grid-template-columns:1fr 1fr}}button,.btn{background:#e30613;color:white;border:0;border-radius:12px;padding:14px 16px;font-weight:800;font-size:16px;cursor:pointer}.secondary{background:#222}.ghost{background:#eee;color:#222}input,select,textarea{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;margin:8px 0 14px;font-size:16px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tab{background:#fff;color:#222;border:2px solid #eee}.tab.active{background:#222;color:white}.status{display:inline-block;background:#222;color:#fff;border-radius:999px;padding:7px 12px;font-weight:bold}.stars{font-size:38px;color:#ffb400;letter-spacing:3px}.map{height:280px;background:linear-gradient(45deg,#e9edf0 25%,#fff 25%,#fff 50%,#e9edf0 50%,#e9edf0 75%,#fff 75%);background-size:70px 70px;border-radius:18px;position:relative;overflow:hidden}.pin{position:absolute;background:#e30613;color:white;border-radius:14px;padding:10px;font-weight:900}.van{position:absolute;left:45%;top:55%;font-size:42px}.route{position:absolute;left:28%;top:28%;width:45%;height:45%;border-left:7px solid #222;border-bottom:7px solid #222;transform:rotate(-20deg);border-radius:20px}.small{color:#666;font-size:14px}.hide{display:none}</style></head><body><div class="top"><div>Darty <span style="font-size:15px">Serviços</span></div><button class="ghost" onclick="logout()">Sair</button></div><div class="wrap" id="app"></div><script>
const services=[['tv','Instalação de TV',39],['wifi','Configuração Wi‑Fi',29],['maq','Instalação Máquina de Lavar',49],['smart','Smart Home',59]];let role=localStorage.role||'';let bookings=JSON.parse(localStorage.bookings||'[]');if(!bookings.length){bookings=[{id:'B1001',client:'Cliente Demo',service:'tv',address:'Lisboa',date:'2026-05-04',slot:'14:00 - 16:00',tech:'Rui Santos',status:'A caminho',rating:null}]}
function save(){localStorage.bookings=JSON.stringify(bookings)}function logout(){localStorage.removeItem('role');role='';render()}function login(r){role=r;localStorage.role=r;render()}function serviceName(id){return (services.find(s=>s[0]==id)||services[0])[1]}function price(id){return (services.find(s=>s[0]==id)||services[0])[2]}
function render(){const a=document.getElementById('app'); if(!role){a.innerHTML=`<div class="card"><h1>App de Serviços ao Domicílio</h1><p>Escolhe um perfil para testar a aplicação.</p><div class="grid"><button onclick="login('client')">Entrar como Cliente</button><button onclick="login('tech')" class="secondary">Entrar como Técnico</button><button onclick="login('admin')" class="secondary">Entrar como Admin</button></div></div>`;return} if(role==='client')client(a); if(role==='tech')tech(a); if(role==='admin')admin(a)}
function client(a){a.innerHTML=`<h1>Cliente</h1><div class="grid"><div class="card"><h2>Agendar serviço</h2><label>Serviço</label><select id="svc">${services.map(s=>`<option value="${s[0]}">${s[1]} — €${s[2]}</option>`).join('')}</select><label>Morada</label><input id="addr" placeholder="Rua, cidade"><label>Data</label><input id="date" type="date" value="2026-05-04"><label>Horário</label><select id="slot"><option>09:00 - 11:00</option><option>11:00 - 13:00</option><option>14:00 - 16:00</option><option>16:00 - 18:00</option></select><button onclick="addBooking()">Confirmar serviço</button></div><div><h2>Os meus serviços</h2>${bookings.map(card).join('')}</div></div>`}
function addBooking(){let b={id:'B'+Math.floor(1000+Math.random()*9000),client:'Cliente',service:svc.value,address:addr.value||'Morada não indicada',date:date.value,slot:slot.value,tech:'Por atribuir',status:'Pendente',rating:null};bookings.unshift(b);save();render()}
function card(b,i){return `<div class="card"><b>#${b.id}</b><h3>${serviceName(b.service)}</h3><p>${b.address}</p><p>📅 ${b.date} · 🕒 ${b.slot} · 💶 €${price(b.service)},00</p><p>Técnico: <b>${b.tech}</b></p><span class="status">${b.status}</span>${b.status==='A caminho'?`<div class="map"><div class="route"></div><div class="pin" style="right:20px;top:30px">Darty Hub</div><div class="pin" style="left:20px;bottom:30px">Minha Casa</div><div class="van">🚐</div></div>`:''}${b.status==='Concluído'&&!b.rating?`<p>Avaliar:</p><button onclick="rate(${i},5)">★★★★★</button>`:''}${b.rating?`<div class="stars">★★★★★</div>`:''}</div>`}
function rate(i,r){bookings[i].rating=r;save();render()}
function tech(a){a.innerHTML=`<h1>Técnico</h1>${bookings.map((b,i)=>`<div class="card"><h3>${serviceName(b.service)}</h3><p>${b.address}</p><p>${b.date} · ${b.slot}</p><span class="status">${b.status}</span><div class="tabs"><button onclick="setStatus(${i},'Atribuído')">Aceitar</button><button onclick="setStatus(${i},'A caminho')">A caminho</button><button onclick="setStatus(${i},'Chegou')">Cheguei</button><button onclick="setStatus(${i},'Concluído')">Concluir</button></div></div>`).join('')}`}
function setStatus(i,s){bookings[i].status=s;bookings[i].tech='Rui Santos';save();render()}
function admin(a){a.innerHTML=`<h1>Admin</h1><div class="grid"><div class="card"><h2>Resumo</h2><p>Pedidos: <b>${bookings.length}</b></p><p>Receita prevista: <b>€${bookings.reduce((t,b)=>t+price(b.service),0)}</b></p><p>Técnicos: <b>2</b></p></div><div>${bookings.map((b,i)=>`<div class="card"><h3>${serviceName(b.service)}</h3><p>${b.address}</p><span class="status">${b.status}</span><p><button onclick="setStatus(${i},'Atribuído')">Atribuir Rui</button></p></div>`).join('')}</div></div>`}
if('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js');render();</script></body></html>
